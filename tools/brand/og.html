<!doctype html><meta charset="utf-8">
<style>
  :root{--s:#262626;--sh:#1c1c1c;--li:#303030}
  html,body{margin:0;width:1200px;height:630px;background:var(--s);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#e6e6e6;overflow:hidden}
  .wrap{display:grid;grid-template-columns:1fr 560px;gap:56px;align-items:center;height:100%;padding:0 72px}
  .mark{display:flex;align-items:center;gap:0;margin:0 0 24px}
  .mark svg{width:132px;height:88px;margin-right:8px}
  .mark span{font-size:96px;line-height:1;font-weight:800;background:linear-gradient(90deg,#b3a0ff,#ff86bd);-webkit-background-clip:text;color:transparent}
  p{margin:0 0 34px;font-size:30px;line-height:1.35;color:#a8a8a8}
  .tags{display:flex;gap:14px;flex-wrap:wrap}
  .tag{padding:8px 20px;border-radius:999px;font-size:22px;color:#a8a8a8;background:var(--s);box-shadow:inset 3px 3px 7px var(--sh),inset -3px -3px 7px var(--li)}
  .shot{padding:16px;border-radius:36px;background:var(--s);box-shadow:-14px -14px 30px var(--li),14px 14px 30px var(--sh)}
  .shot img{display:block;width:100%;border-radius:22px}
</style>
<div class="wrap">
  <div>
    <div class="mark">
      <svg viewBox="8 16 48 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b3a0ff"/><stop offset="1" stop-color="#ff86bd"/></linearGradient></defs>
        <path d="M32 32C38 22 51 22 51 32C51 42 38 42 32 32C26 22 13 22 13 32C13 42 26 42 32 32Z" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/></svg>
      <span>bin</span>
    </div>
    <p>Two audio mixers, an anime tracker and a printer manager.</p>
    <div class="tags"><span class="tag">Rust</span><span class="tag">Python</span><span class="tag">Qt</span><span class="tag">Linux</span></div>
  </div>
  <div class="shot"><img src="../../public/projects/vox-pro/main.png"></div>
</div>
